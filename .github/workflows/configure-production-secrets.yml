name: Configure production internal secrets

on:
  workflow_dispatch:

concurrency:
  group: configure-production-internal-secrets
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  REGION: asia-northeast1
  GATEWAY_SECRET_NAME: mzm-gateway-origin-secret
  QUEUE_SECRET_NAME: mzm-queue-callback-secret

jobs:
  configure:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate configuration
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          GATEWAY_ORIGIN_SECRET: ${{ secrets.GATEWAY_ORIGIN_SECRET }}
          QUEUE_CALLBACK_SECRET: ${{ secrets.QUEUE_CALLBACK_SECRET }}
        run: |
          set -euo pipefail
          : "${PROJECT_ID:?Set the GCP_PROJECT_ID repository variable}"
          : "${WIF_PROVIDER:?Set the GCP_WIF_PROVIDER repository variable}"
          : "${DEPLOY_SERVICE_ACCOUNT:?Set the GCP_DEPLOY_SERVICE_ACCOUNT repository variable}"
          : "${GATEWAY_ORIGIN_SECRET:?Set the GATEWAY_ORIGIN_SECRET repository secret}"
          : "${QUEUE_CALLBACK_SECRET:?Set the QUEUE_CALLBACK_SECRET repository secret}"
          test "${GATEWAY_ORIGIN_SECRET}" != "${QUEUE_CALLBACK_SECRET}"

      - name: Authenticate to Google Cloud with WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Create secrets or add new versions
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GATEWAY_ORIGIN_SECRET: ${{ secrets.GATEWAY_ORIGIN_SECRET }}
          QUEUE_CALLBACK_SECRET: ${{ secrets.QUEUE_CALLBACK_SECRET }}
        run: |
          set -euo pipefail
          put_secret() {
            local name="$1"
            local value="$2"
            if gcloud secrets describe "${name}" --project="${PROJECT_ID}" >/dev/null 2>&1; then
              printf '%s' "${value}" | gcloud secrets versions add "${name}" \
                --project="${PROJECT_ID}" \
                --data-file=- >/dev/null
            else
              printf '%s' "${value}" | gcloud secrets create "${name}" \
                --project="${PROJECT_ID}" \
                --replication-policy=automatic \
                --data-file=- >/dev/null
            fi
          }
          put_secret "${GATEWAY_SECRET_NAME}" "${GATEWAY_ORIGIN_SECRET}"
          put_secret "${QUEUE_SECRET_NAME}" "${QUEUE_CALLBACK_SECRET}"

      - name: Grant runtime service accounts secret access
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          for service in mzm-backend mzm-auth; do
            runtime_account="$(gcloud run services describe "${service}" \
              --project="${PROJECT_ID}" \
              --region="${REGION}" \
              --format='value(spec.template.spec.serviceAccountName)')"
            test -n "${runtime_account}"
            for secret in "${GATEWAY_SECRET_NAME}" "${QUEUE_SECRET_NAME}"; do
              gcloud secrets add-iam-policy-binding "${secret}" \
                --project="${PROJECT_ID}" \
                --member="serviceAccount:${runtime_account}" \
                --role='roles/secretmanager.secretAccessor' >/dev/null
            done
          done

      - name: Update Cloud Run secret references
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          for service in mzm-backend mzm-auth; do
            gcloud run services update "${service}" \
              --project="${PROJECT_ID}" \
              --region="${REGION}" \
              --update-secrets="GATEWAY_ORIGIN_SECRET=${GATEWAY_SECRET_NAME}:latest,QUEUE_CALLBACK_SECRET=${QUEUE_SECRET_NAME}:latest" \
              --quiet >/dev/null
          done

      - name: Verify Cloud Run readiness and secret references
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          for service in mzm-backend mzm-auth; do
            document="$(gcloud run services describe "${service}" \
              --project="${PROJECT_ID}" \
              --region="${REGION}" \
              --format=json)"
            DOCUMENT="${document}" SERVICE="${service}" node <<'NODE'
          const service = JSON.parse(process.env.DOCUMENT)
          const expected = new Map([
            ['GATEWAY_ORIGIN_SECRET', 'mzm-gateway-origin-secret'],
            ['QUEUE_CALLBACK_SECRET', 'mzm-queue-callback-secret']
          ])
          const containers = service.spec?.template?.spec?.containers ?? []
          const env = containers.flatMap((container) => container.env ?? [])
          for (const [name, secret] of expected) {
            const variable = env.find((entry) => entry.name === name)
            if (variable?.valueFrom?.secretKeyRef?.name !== secret) process.exit(1)
          }
          const ready = service.status?.conditions?.find((condition) => condition.type === 'Ready')
          if (ready?.status !== 'True') process.exit(1)
          console.log(JSON.stringify({
            service: process.env.SERVICE,
            ready: true,
            revision: service.status?.latestReadyRevisionName,
            secretReferences: [...expected.keys()]
          }))
          NODE
          done
