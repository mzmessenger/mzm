name: Build and Deploy mzm-backend

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run
        type: choice
        required: true
        default: deploy
        options:
          - deploy
          - verify-wif
          - configure-internal-secrets

concurrency:
  group: deploy-cloudrun-backend-production
  cancel-in-progress: false

env:
  SERVICE: mzm-backend
  REGION: asia-northeast1

jobs:
  verify-wif:
    if: github.ref == 'refs/heads/dev' && inputs.operation == 'verify-wif'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate WIF configuration
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          : "${PROJECT_ID:?Set the GCP_PROJECT_ID repository variable}"
          : "${WIF_PROVIDER:?Set the GCP_WIF_PROVIDER repository variable}"
          : "${DEPLOY_SERVICE_ACCOUNT:?Set the GCP_DEPLOY_SERVICE_ACCOUNT repository variable}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud with WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify impersonated identity and Cloud Run access
        env:
          EXPECTED_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          gcloud auth print-access-token >/dev/null
          active_account="$(gcloud auth list --filter=status:ACTIVE --format='value(account)')"
          test "${active_account}" = "${EXPECTED_ACCOUNT}"
          for service in mzm-backend mzm-auth; do
            gcloud run services describe "${service}" \
              --project="${{ vars.GCP_PROJECT_ID }}" \
              --region="${REGION}" \
              --format='yaml(metadata.name,spec.template.spec.serviceAccountName,status.conditions,status.latestCreatedRevisionName,status.latestReadyRevisionName,status.traffic,status.url)'
          done

  configure-internal-secrets:
    if: github.ref == 'refs/heads/dev' && inputs.operation == 'configure-internal-secrets'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      GATEWAY_SECRET_NAME: mzm-gateway-origin-secret
      QUEUE_SECRET_NAME: mzm-queue-callback-secret
    steps:
      - name: Validate secret configuration
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          GATEWAY_ORIGIN_SECRET: ${{ secrets.GATEWAY_ORIGIN_SECRET }}
          QUEUE_CALLBACK_SECRET: ${{ secrets.QUEUE_CALLBACK_SECRET }}
        run: |
          set -euo pipefail
          : "${PROJECT_ID:?Set the GCP_PROJECT_ID repository variable}"
          : "${WIF_PROVIDER:?Set the GCP_WIF_PROVIDER repository variable}"
          : "${DEPLOY_SERVICE_ACCOUNT:?Set the GCP_DEPLOY_SERVICE_ACCOUNT repository variable}"
          : "${GATEWAY_ORIGIN_SECRET:?Set the GATEWAY_ORIGIN_SECRET repository secret}"
          : "${QUEUE_CALLBACK_SECRET:?Set the QUEUE_CALLBACK_SECRET repository secret}"
          test "${GATEWAY_ORIGIN_SECRET}" != "${QUEUE_CALLBACK_SECRET}"

      - name: Authenticate to Google Cloud with WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Create secrets or add new versions
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GATEWAY_ORIGIN_SECRET: ${{ secrets.GATEWAY_ORIGIN_SECRET }}
          QUEUE_CALLBACK_SECRET: ${{ secrets.QUEUE_CALLBACK_SECRET }}
        run: |
          set -euo pipefail
          put_secret() {
            local name="$1"
            local value="$2"
            if gcloud secrets describe "${name}" --project="${PROJECT_ID}" >/dev/null 2>&1; then
              printf '%s' "${value}" | gcloud secrets versions add "${name}" \
                --project="${PROJECT_ID}" --data-file=- >/dev/null
            else
              printf '%s' "${value}" | gcloud secrets create "${name}" \
                --project="${PROJECT_ID}" --replication-policy=automatic \
                --data-file=- >/dev/null
            fi
          }
          put_secret "${GATEWAY_SECRET_NAME}" "${GATEWAY_ORIGIN_SECRET}"
          put_secret "${QUEUE_SECRET_NAME}" "${QUEUE_CALLBACK_SECRET}"

      - name: Grant runtime service accounts secret access
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          for service in mzm-backend mzm-auth; do
            runtime_account="$(gcloud run services describe "${service}" \
              --project="${PROJECT_ID}" --region="${REGION}" \
              --format='value(spec.template.spec.serviceAccountName)')"
            test -n "${runtime_account}"
            for secret in "${GATEWAY_SECRET_NAME}" "${QUEUE_SECRET_NAME}"; do
              gcloud secrets add-iam-policy-binding "${secret}" \
                --project="${PROJECT_ID}" \
                --member="serviceAccount:${runtime_account}" \
                --role='roles/secretmanager.secretAccessor' >/dev/null
            done
          done

      - name: Update Cloud Run secret references
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          for service in mzm-backend mzm-auth; do
            gcloud run services update "${service}" \
              --project="${PROJECT_ID}" --region="${REGION}" \
              --update-secrets="GATEWAY_ORIGIN_SECRET=${GATEWAY_SECRET_NAME}:latest,QUEUE_CALLBACK_SECRET=${QUEUE_SECRET_NAME}:latest" \
              --quiet >/dev/null
          done

      - name: Verify Cloud Run readiness and secret references
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          for service in mzm-backend mzm-auth; do
            document="$(gcloud run services describe "${service}" \
              --project="${PROJECT_ID}" --region="${REGION}" --format=json)"
            DOCUMENT="${document}" SERVICE="${service}" node <<'NODE'
          const service = JSON.parse(process.env.DOCUMENT)
          const expected = new Map([
            ['GATEWAY_ORIGIN_SECRET', 'mzm-gateway-origin-secret'],
            ['QUEUE_CALLBACK_SECRET', 'mzm-queue-callback-secret']
          ])
          const env = (service.spec?.template?.spec?.containers ?? [])
            .flatMap((container) => container.env ?? [])
          for (const [name, secret] of expected) {
            const variable = env.find((entry) => entry.name === name)
            if (variable?.valueFrom?.secretKeyRef?.name !== secret) process.exit(1)
          }
          const ready = service.status?.conditions?.find((condition) => condition.type === 'Ready')
          if (ready?.status !== 'True') process.exit(1)
          console.log(JSON.stringify({
            service: process.env.SERVICE,
            ready: true,
            revision: service.status?.latestReadyRevisionName,
            secretReferences: [...expected.keys()]
          }))
          NODE
          done

  deploy:
    if: github.ref == 'refs/heads/dev' && inputs.operation == 'deploy'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate deployment configuration
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          ARTIFACT_REGISTRY: ${{ vars.GCP_ARTIFACT_REGISTRY }}
        run: |
          set -euo pipefail
          : "${PROJECT_ID:?Set the GCP_PROJECT_ID repository variable}"
          : "${WIF_PROVIDER:?Set the GCP_WIF_PROVIDER repository variable}"
          : "${DEPLOY_SERVICE_ACCOUNT:?Set the GCP_DEPLOY_SERVICE_ACCOUNT repository variable}"
          : "${ARTIFACT_REGISTRY:?Set the GCP_ARTIFACT_REGISTRY repository variable}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud with WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Authorize Artifact Registry push
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build container
        env:
          IMAGE: '${{ vars.GCP_ARTIFACT_REGISTRY }}/mzm-backend:${{ github.sha }}'
        run: |
          set -euo pipefail
          docker build -f ./packages/backend/Dockerfile -t "${IMAGE}" .

      - name: Verify container entrypoint
        env:
          IMAGE: '${{ vars.GCP_ARTIFACT_REGISTRY }}/mzm-backend:${{ github.sha }}'
        run: |
          set -euo pipefail
          test "$(docker inspect --format '{{json .Config.Cmd}}' "${IMAGE}")" = '["node","packages/backend/dist/src/server.js"]'
          docker run --rm --entrypoint test "${IMAGE}" -f packages/backend/dist/src/server.js
          docker run --rm --entrypoint node "${IMAGE}" -e "if (process.versions.node.split('.')[0] !== '24') process.exit(1)"
          docker run --rm --entrypoint node "${IMAGE}" -e "import('./packages/backend/node_modules/undici/index.js')"

      - name: Push container
        env:
          IMAGE: '${{ vars.GCP_ARTIFACT_REGISTRY }}/mzm-backend:${{ github.sha }}'
        run: |
          set -euo pipefail
          docker push "${IMAGE}"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          service: ${{ env.SERVICE }}
          image: ${{ vars.GCP_ARTIFACT_REGISTRY }}/mzm-backend:${{ github.sha }}
          region: ${{ env.REGION }}

      - name: Report deployed URL
        run: |
          printf 'Cloud Run URL: %s\n' '${{ steps.deploy.outputs.url }}'
